# Models tracked by the leaderboard.
#
# A model appears on the leaderboard with scores once results/<id>/v1-test/scores.json
# exists; until then it is listed as "awaiting evaluation".
#
#   provider  - adapter (anthropic | openai | google | mistral-ocr | compat | google-vision |
#               azure-di | tesseract | easyocr | paddleocr | import)
#   model     - the provider's model identifier
#   params    - adapter parameters (recorded with every result)
#   verify_id - true where the API identifier comes from release announcements and has not
#               been checked against the provider's live model list yet
#   import    - systems without a built-in adapter: run them yourself and bring predictions
#               in with `tamilbench import-predictions`
#
# Release dates are as announced (YYYY-MM).

